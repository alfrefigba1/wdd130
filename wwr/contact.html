<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Splash White Water Rafting for reservations, questions, and rafting information.">
    <meta name="author" content="Alfred Aondoaver Igba">
    <title>Contact Us | Splash White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body> <!-- Header -->
    <header> <img src="images/logo.png" alt="Splash White Water Rafting Logo" class="logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header> <!-- Main Content -->
    <main> <!-- Company Information -->
        <section class="contact-intro">
            <h1>Splash White Water Rafting</h1>
            <address> <strong>64 Iorkyaa-Ako Street</strong><br> Makurdi, Nigeria<br>
                <strong>+2348072097350</strong><br> <strong>info@splashwhitewater.com</strong>
            </address>
        </section> <!-- Map and Contact Form -->
        <section class="contact-area"> <!-- Google Map -->
            <div class="map"> <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15814.568300026931!2d8.503908271019887!3d7.721497104321728!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1050803602c940a9%3A0x8b9b5ef42920401f!2sIorkyaa%20Ako%20Street%2C%20High%20Level%2C%20Wailomayo%20970101%2C%20Benue%2C%20Nigeria!5e0!3m2!1sen!2sus!4v1790870021514!5m2!1sen!2sus"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"
                  title="Map showing the location of Splash White Water Rafting"> </iframe> </div>

            <!-- Contact Form -->
            <form>
                <div class="form-group"> <label for="name">Name</label> <input type="text" id="name"
                      name="name" placeholder="Your name" required> </div>
                <div class="form-group"> <label for="email">Email</label> <input type="email"
                      id="email" name="email" placeholder="Your email" required> </div>
                <fieldset>
                    <fieldset>
                        <legend>Purpose</legend> <label for="general-inquiry"> <input type="radio"
                              id="general-inquiry" name="purpose" value="general-inquiry" required>
                            General Inquiry </label> <label for="reservation-question"> <input
                              type="radio" id="reservation-question" name="purpose"
                              value="reservation-question"> Reservation Question </label> <label
                          for="website-suggestion"> <input type="radio" id="website-suggestion"
                              name="purpose" value="website-suggestion"> Website Suggestion </label>
                    </fieldset>
                    <div class="form-group"> <label for="message">Message</label> <textarea
                          id="message" name="message" placeholder="Type your message here"
                          required></textarea>
                    </div>
                    <label class="subscribe" for="subscribe"> <input type="checkbox" id="subscribe"
                          name="subscribe" value="yes"> Please subscribe me to the monthly
                        newsletter </label>
                    <button type="submit">Get in Touch!</button>
            </form>
        </section> <!-- Employee Profiles -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-gallery">
                <figure> <img src="images/employee1.jpg" alt="Employee profile">
                    <figcaption>Adventure Guide</figcaption>
                </figure>
                <figure> <img src="images/employee2.jpg" alt="Employee profile">
                    <figcaption>Reservation Manager</figcaption>
                </figure>
                <figure> <img src="images/employee3.jpg" alt="Employee profile">
                    <figcaption>Safety Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main> <!-- Footer -->
    <footer>
        <p> &copy; 2026 Splash White Water Rafting | Alfred Aondoaver Igba </p>
        <nav class="socialmedia"> <a href="https://facebook.com"> <img src="images/facebook.png"
                  alt="Facebook Icon"> </a> <a href="https://instagram.com"> <img
                  src="images/instagram.jpg" alt="Instagram Icon"> </a> <a
              href="https://linkedin.com"> <img src="images/linkedin.jpg" alt="LinkedIn Icon"> </a>
        </nav>
    </footer>
</body>

</html>
