<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Exercise</title>
    <link rel="stylesheet" href="styles/table.css">
</head>

<body>
    <h1>Table Exercise by Alfred A Igba</h1>
    <table>
        <thead>
            <tr>
                <th>League</th>
                <th>Team</th>
                <th>Record</th>
                <th>Player Count</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="2">EPL</th>
                <td>Chelsea</td>
                <td>32-11</td>
                <td>13</td>
            </tr>
            <tr>
                <td>Arsenal</td>
                <td>23-14</td>
                <td>11</td>
            </tr>
            <tr>
                <th rowspan="3">La liga</th>
                <td>Barcelona</td>
                <td>71-65</td>
                <td>21</td>
            </tr>
            <tr>
                <td>Madrid</td>
                <td>52-19</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Valencia</td>
                <td>10-7</td>
                <td>12</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="3">Total Players</th>
                <td>77</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
